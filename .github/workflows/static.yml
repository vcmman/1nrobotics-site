# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    tags:
      - 'v0.1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Reruns can still see artifacts uploaded by previous attempts.
          name: ${{ env.PAGES_ARTIFACT }}
          # Upload entire repository
          path: '.'
      - name: Wait for the uploaded artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 5 \
                --header "Authorization: Bearer $GH_TOKEN" \
                --get --data-urlencode "name=$PAGES_ARTIFACT" "$ARTIFACTS_URL" \
                | jq -e --arg name "$PAGES_ARTIFACT" \
                  'any(.artifacts[]; .name == $name and (.expired | not))' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT did not become visible in time"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
